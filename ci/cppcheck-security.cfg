# Cppcheck Security Configuration for AdaptivePWM
# CISSP Domain 6 / ISO 27001:2022 8.25 / NIST CSF DE.AE
#
# This configuration enables all security-related checks for C/C++ embedded code

# Enable all security-related checks
enable=all

# Addons - enable security addon
addon=security
addon=cert

# Security-focused checks
style=yes
warning=yes
performance=yes
portability=yes
information=yes

# Specific security rule configurations
# Buffer overflow detection
--enable=warning,style
# Memory leak detection
--enable=warning
# Dangerous function usage
--enable=warning,style
# Integer overflow
--enable=warning

# Include paths
-I include
-I src

# Suppressions file
suppress=ci/cppcheck-suppressions.txt

# Output format
template="{file}:{line}:{column}: {severity}: {message} [{id}]"

# Check level - thorough for security
--check-level=exhaustive

# Force check all configurations
--force

# Maximum C++ standard
--std=c99

# Platform
--platform=unix32

# Additional security check configurations
# Enable null pointer dereference detection
--enable=nullPointer
# Enable unused function detection
--enable=unusedFunction
# Enable missing return detection
--enable=missingReturn

# Exit code on error
--error-exitcode=1
