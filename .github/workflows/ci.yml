# AdaptivePWM — continuous integration
# Primary: STM32CubeIDE Makefile build (arm-none-eabi-gcc)
# Secondary: feature-flag smoke checks

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware-cubeide:
    name: Firmware (CubeIDE Makefile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: Build (make)
        run: make -j"$(nproc)" all

      - name: Size report
        run: arm-none-eabi-size build/cubeide/AdaptivePWM.elf

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: adaptivepwm-cubeide
          path: |
            build/cubeide/AdaptivePWM.bin
            build/cubeide/AdaptivePWM.elf
            build/cubeide/AdaptivePWM.hex
            build/cubeide/AdaptivePWM.map
          if-no-files-found: error

  host-smoke:
    name: Feature defaults smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bring-up feature defaults
        run: |
          set -euo pipefail
          grep -q 'FEATURE_SECURITY_PROFILE[[:space:]]*0' config/features.h
          grep -q 'FEATURE_VOUT_CONTROL[[:space:]]*1' config/features.h
          grep -q 'FEATURE_EFFICIENCY_CONTROL[[:space:]]*0' config/features.h
          test -f Makefile
          test -f STM32F401RETX_FLASH.ld
          test -f App/Src/main.c
          test -f Core/Inc/stm32f4xx_hal_conf.h
          echo "Host smoke OK"
