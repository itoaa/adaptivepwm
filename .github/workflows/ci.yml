# AdaptivePWM — continuous integration
# Builds firmware (PlatformIO env:ci) and host unit tests that do not need hardware.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware (PlatformIO env:ci)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PlatformIO
        run: |
          python -m pip install -U pip
          python -m pip install -U platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Build env:ci
        run: python -m platformio run -e ci

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: adaptivepwm-firmware-ci
          path: |
            .pio/build/ci/firmware.bin
            .pio/build/ci/firmware.elf
            .pio/build/ci/firmware.hex
          if-no-files-found: error

  host-smoke:
    name: Host compile smoke (gcc + HAL stubs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Validate bring-up feature defaults
        run: |
          set -euo pipefail
          # Grep-based checks (no HAL dependency): defaults must keep lab bring-up safe
          grep -q 'FEATURE_SECURITY_PROFILE[[:space:]]*0' config/features.h
          grep -q 'FEATURE_VOUT_CONTROL[[:space:]]*1' config/features.h
          grep -q 'FEATURE_EFFICIENCY_CONTROL[[:space:]]*0' config/features.h
          grep -q 'FEATURE_CLI_AUTH' config/features.h
          test -f .github/workflows/ci.yml
          test -f platformio.ini
          grep -q '\[env:ci\]' platformio.ini
          echo "Host smoke OK (feature defaults + CI profile present)"
