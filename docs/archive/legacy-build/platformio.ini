; PlatformIO Project Configuration File
; AdaptivePWM - CISSP-Aligned Security Framework
;
; Build configurations with framework enforcement

[platformio]
src_dir = src
include_dir = include
test_dir = tests
data_dir = data
default_envs = ci

[common]
platform = ststm32
board = nucleo_f401re
framework = stm32cube

; Quality flags (do not use blanket -Werror — STM32Cube HAL trips unused-parameter)
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F401xE
    -Iinclude
    -Iconfig
    -Isrc
    -Wall
    -Wextra
    -Werror=implicit-function-declaration
    -Werror=return-type
    -Werror=uninitialized
    -DRNG_FALLBACK_SOFTWARE=1
    ; Security defaults off via config/features.h — override e.g. -DFEATURE_CLI_AUTH=1

check_tool = cppcheck, clangtidy
check_flags =
    --enable=all
    --suppress=missingInclude
    --suppress=unmatchedSuppression

[env:nucleo_f401re]
extends = common
build_type = release
build_flags =
    ${common.build_flags}
    -Os
    -DNDEBUG
    -DSECURITY_CHECKS
    -DWATCHDOG_ENABLED

[env:nucleo_f401re_debug]
extends = common
build_type = debug
build_flags =
    ${common.build_flags}
    -Og
    -g3
    -DDEBUG
    -DCLI_ENABLED
    -DASSERT_ENABLED

[env:nucleo_f401re_profile]
extends = common
build_type = debug
build_flags =
    ${common.build_flags}
    -O2
    -g2
    -DPROFILE_ENABLED
    -DCOVERAGE_ENABLED

[env:nucleo_f401re_test]
extends = common
build_type = debug
build_flags =
    ${common.build_flags}
    -Og
    -g3
    -DTEST_MODE
    -DMOCK_HARDWARE

; GitHub Actions / local CI profile — firmware release build (bring-up flags)
[env:ci]
extends = common
build_type = release
build_flags =
    ${common.build_flags}
    -Os
    -DNDEBUG
    -DCI_BUILD
    -DWATCHDOG_ENABLED
